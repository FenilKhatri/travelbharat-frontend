<!doctype html>
<html lang="en">
  <head>
    <!-- BASIC -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- FAVICON & WEB LOGO -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="512x512" href="/logo.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="/logo.png" />

    <!-- SEO TITLE (LOCAL + HIGH INTENT) -->
    <title>
      TravelBharat – Explore India State by State
    </title>

    <!-- META DESCRIPTION & KEYWORDS -->
    <meta
      name="description"
      content="TravelBharat is a centralized tourism information web platform that provides state-wise and city-wise details of tourist destinations across India. Discover places, attractions, culture, heritage sites, and travel insights."
    />
    <meta name="keywords" content="India travel, Indian tourism, state-wise destinations, city-wise details, tourist attractions, heritage sites, Indian culture, TravelBharat, trip planner, travel insights, explore India" />

    <!-- CLEAN META -->
    <meta name="author" content="TravelBharat" />
    <meta name="robots" content="index,follow" />

    <!-- CANONICAL -->
    <link rel="canonical" href="https://travelbharatofficial.vercel.app/" />

    <!-- OPEN GRAPH -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="TravelBharat" />
    <meta
      property="og:title"
      content="TravelBharat – Explore India State by State"
    />
    <meta
      property="og:description"
      content="Discover the beauty of India with TravelBharat. Explore top destinations, heritage sites, and rich culture state by state."
    />
    <meta property="og:url" content="https://travelbharatofficial.vercel.app/" />
    <meta property="og:image" content="https://travelbharatofficial.vercel.app/logo.png" />
    <meta property="og:image:alt" content="TravelBharat Web Logo" />

    <!-- TWITTER -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@TravelBharat" />
    <meta name="twitter:title" content="TravelBharat – Explore India" />
    <meta
      name="twitter:description"
      content="Discover the beauty of India with TravelBharat. Explore top destinations state by state."
    />
    <meta name="twitter:image" content="https://travelbharatofficial.vercel.app/logo.png" />

    <!-- PERFORMANCE -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- ADVANCED STRUCTURED DATA -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "TravelBharat",
        "url": "https://travelbharatofficial.vercel.app/",
        "description": "Tourism platform to explore Indian destinations, heritage sites, and culture.",
        "potentialAction": {
          "@type": "SearchAction",
          "target": "https://travelbharatofficial.vercel.app/search?q={search_term_string}",
          "query-input": "required name=search_term_string"
        }
      }
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/Main.jsx"></script>
  </body>
</html>
