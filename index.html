<!doctype html>
<html lang="en">
  <head>
    <!-- BASIC -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- FAVICON -->
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />

    <!-- SEO TITLE (LOCAL + HIGH INTENT) -->
    <title>
      TravelBharat – Explore India State by State
    </title>

    <!-- META DESCRIPTION -->
    <meta
      name="description"
      content="TravelBharat is a centralized tourism information web platform that provides state-wise and city-wise details of tourist destinations across India. Discover places, attractions, culture, heritage sites, and travel insights."
    />

    <!-- CLEAN META -->
    <meta name="author" content="TravelBharat" />
    <meta name="robots" content="index,follow" />

    <!-- CANONICAL -->
    <link rel="canonical" href="https://travelbharat.in/" />

    <!-- OPEN GRAPH -->
    <meta property="og:type" content="website" />
    <meta
      property="og:title"
      content="TravelBharat – Explore India State by State"
    />
    <meta
      property="og:description"
      content="Discover the beauty of India with TravelBharat. Explore top destinations, heritage sites, and rich culture state by state."
    />
    <meta property="og:url" content="https://travelbharat.in/" />

    <!-- TWITTER -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="TravelBharat – Explore India" />
    <meta
      name="twitter:description"
      content="Discover the beauty of India with TravelBharat. Explore top destinations state by state."
    />

    <!-- PERFORMANCE -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- ADVANCED STRUCTURED DATA -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "TravelBharat",
        "url": "https://travelbharat.in/",
        "description": "Tourism platform to explore Indian destinations, heritage sites, and culture.",
        "potentialAction": {
          "@type": "SearchAction",
          "target": "https://travelbharat.in/search?q={search_term_string}",
          "query-input": "required name=search_term_string"
        }
      }
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/Main.jsx"></script>
  </body>
</html>
